services:
  mysqldb:
    image: mysql:8.1
    command: --skip-host-cache --skip-name-resolve
    env_file: ./.env
    environment:
      MYSQL_USER: $MYSQLDB_USER
      MYSQL_PASSWORD: $MYSQLDB_PASSWORD
      MYSQL_ROOT_PASSWORD: $MYSQLDB_ROOT_PASSWORD
      MYSQL_DATABASE: $MYSQLDB_DATABASE
    ports:
      - "$MYSQLDB_LOCAL_PORT:$MYSQLDB_DOCKER_PORT"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost"]
      interval: 30s
      timeout: 30s
      retries: 3
    volumes:
      - my-datavolume:/var/lib/mysql

  minio:
    image: minio/minio:latest
    restart: on-failure
    command: server /data --console-address ":9090"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - miniodata:/data
    ports:
      - "9100:9000"
      - "9101:9090"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      mc mb --ignore-existing local/book-covers &&
      mc anonymous set download local/book-covers
      "
    restart: "no"

  app:
    depends_on:
      mysqldb:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: on-failure
    image: online-book-store
    build: .
    env_file: ./.env
    ports:
      - "$SPRING_LOCAL_PORT:$SPRING_DOCKER_PORT"
      - "$DEBUG_PORT:$DEBUG_PORT"
    environment:
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysqldb:${MYSQLDB_DOCKER_PORT}/${MYSQLDB_DATABASE}?enabledTLSProtocols=TLSv1.2"
      SPRING_DATASOURCE_USERNAME: $MYSQLDB_USER
      SPRING_DATASOURCE_PASSWORD: $MYSQLDB_PASSWORD
      SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: org.hibernate.dialect.MySQL8Dialect
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_JPA_SHOW_SQL: "true"
      SPRING_JPA_OPEN_IN_VIEW: "false"
      SERVER_ERROR_INCLUDE_BINDING_ERRORS: always
      SERVER_ERROR_INCLUDE_MESSAGE: always
      JWT_EXPIRATION: "1500000"
      JWT_SECRET: BookOnlineSecrete1254882566MateAcademy9954365Code
      JAVA_TOOL_OPTIONS: "-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:$DEBUG_PORT"
      APP_STORAGE_ENDPOINT: "http://minio:9000"
      APP_STORAGE_PUBLIC_URL: "http://localhost:9100"
      APP_STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      APP_STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}

volumes:
  my-datavolume:
  miniodata:
