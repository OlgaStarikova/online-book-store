services:
  mysqldb:
    image: mysql:8.1
    command: --skip-host-cache --skip-name-resolve
    env_file: ./.env
    environment:
      MYSQL_USER: $MYSQLDB_USER
      MYSQL_PASSWORD: $MYSQLDB_PASSWORD
      MYSQL_ROOT_PASSWORD: $MYSQLDB_ROOT_PASSWORD
      MYSQL_DATABASE: $MYSQLDB_DATABASE
    ports:
      - "$MYSQLDB_LOCAL_PORT:$MYSQLDB_DOCKER_PORT"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost"]
      interval: 30s
      timeout: 30s
      retries: 3
    volumes:
      - my-datavolume:/var/lib/mysql

  app:
    depends_on:
      mysqldb:
        condition: service_healthy
    restart: on-failure
    image: online-book-store
    build: .
    env_file: ./.env
    ports:
      - "$SPRING_LOCAL_PORT:$SPRING_DOCKER_PORT"
      - "$DEBUG_PORT:$DEBUG_PORT"
    volumes:
      - uploads-data:/uploads
    environment:
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysqldb:${MYSQLDB_DOCKER_PORT}/${MYSQLDB_DATABASE}?enabledTLSProtocols=TLSv1.2"
      SPRING_DATASOURCE_USERNAME: $MYSQLDB_USER
      SPRING_DATASOURCE_PASSWORD: $MYSQLDB_PASSWORD
      SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: org.hibernate.dialect.MySQL8Dialect
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_JPA_SHOW_SQL: "true"
      SPRING_JPA_OPEN_IN_VIEW: "false"
      SERVER_ERROR_INCLUDE_BINDING_ERRORS: always
      SERVER_ERROR_INCLUDE_MESSAGE: always
      JWT_EXPIRATION: "1500000"
      JWT_SECRET: BookOnlineSecrete1254882566MateAcademy9954365Code
      JAVA_TOOL_OPTIONS: "-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:$DEBUG_PORT"

volumes:
  my-datavolume:
  uploads-data:
